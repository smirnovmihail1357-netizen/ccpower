plugins {
    id 'java'
    id 'net.minecraftforge.gradle' version '5.1.+'
}

version = '0.5.1'
group = 'ru.wardreg.ccpower'
archivesBaseName = 'ccpower'

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

minecraft {
    mappings channel: 'official', version: '1.19.1'

    runs {
        server {
            workingDirectory project.file('runs/server')
            property 'forge.logging.console.level', 'info'
            args '--nogui', '--mixin.config=ccpower.mixins.json'
            mods { ccpower { source sourceSets.main } }
        }
    }
}

repositories {
    mavenCentral()
    flatDir { dirs 'libs' }
}

configurations {
    cctRuntime
}

dependencies {
    minecraft "net.minecraftforge:forge:1.19.1-42.0.9"
    // CC:T production jar (the exact pinned version). fg.deobf remaps its SRG
    // references into this workspace's official mappings for both compile and dev run.
    compileOnly fg.deobf('cc.tweaked:cct:1.0')
    cctRuntime fg.deobf('cc.tweaked:cct:1.0')
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
}

jar {
    manifest {
        attributes([
            'MixinConfigs'               : 'ccpower.mixins.json',
            'Implementation-Title'       : 'CC: Power',
            'Implementation-Version'     : project.version
        ])
    }
}
jar.finalizedBy('reobfJar')

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.register('copyDevModsServer', Copy) {
    doFirst { delete fileTree('runs/server/mods') }
    from configurations.cctRuntime
    into 'runs/server/mods'
}
tasks.configureEach {
    if (name == 'runServer') dependsOn 'copyDevModsServer'
}
