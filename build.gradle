plugins {
    id 'java'
    id 'net.neoforged.moddev' version '2.0.148'
}

version = '0.8.0'
group = 'ru.wardreg.ccpower'

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

tasks.withType(JavaCompile).configureEach {
    options.release = 21
}

neoForge {
    version = '21.8.57'

    validateAccessTransformers = true

    mods {
        ccpower {
            sourceSet sourceSets.main
        }
    }

    runs {
        client {
            client()
            gameDirectory = project.file('runs/client')
        }
        server {
            server()
            gameDirectory = project.file('runs/server')
        }
    }
}

repositories {
    mavenCentral()
    maven {
        url = 'https://maven.squiddev.cc'
        content { includeGroup 'cc.tweaked' }
    }
    maven {
        // Optional Jade compile-time API (MC 1.21.6/7/8).
        url = 'https://api.modrinth.com/maven'
        content { includeGroup 'maven.modrinth' }
    }
}

configurations {
    cctRuntime
}

dependencies {
    // CC:Tweaked (the "forge" classifier build is the NeoForge jar on these versions).
    compileOnly 'cc.tweaked:cc-tweaked-1.21.8-forge:1.116.1'
    cctRuntime 'cc.tweaked:cc-tweaked-1.21.8-forge:1.116.1'
    // Optional Jade API: the plugin class is only loaded when Jade is installed.
    compileOnly 'maven.modrinth:jade:19.3.1+neoforge'
}

// Keep the colon-free compile classpath workaround from the reference build.
def sanitizedCpDir = layout.dir(providers.provider {
    new File(System.getProperty('java.io.tmpdir'), 'ccpower-classpath-mc/1.21.8')
})
def sanitizeClasspath = tasks.register('sanitizeClasspath', Copy) {
    from configurations.compileClasspath
    into sanitizedCpDir
    includeEmptyDirs = false
}
def sanitizedCpJars = files({
    sanitizedCpDir.get().asFileTree.matching { include '*.jar' }
})
sourceSets.main.compileClasspath = sanitizedCpJars
tasks.named('compileJava') {
    dependsOn sanitizeClasspath
    options.incremental = false
}

// CC:Tweaked in local dev runs.
tasks.register('copyDevModsClient', Copy) {
    from configurations.cctRuntime
    into 'runs/client/mods'
}
tasks.register('copyDevModsServer', Copy) {
    from configurations.cctRuntime
    into 'runs/server/mods'
}
tasks.configureEach {
    if (name == 'runClient') dependsOn 'copyDevModsClient'
    if (name == 'runServer') dependsOn 'copyDevModsServer'
}
