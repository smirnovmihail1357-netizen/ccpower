buildscript {
    repositories {
        maven { url = 'https://maven.minecraftforge.net' }
        mavenCentral()
    }
    dependencies {
        classpath 'net.minecraftforge.gradle:ForgeGradle:4.1.16'
    }
}

apply plugin: 'net.minecraftforge.gradle'
apply plugin: 'java'

// FG 4.1.16 fresh-cache bug: the mapping writers never mkdir their output
// directories. Without these, official-mapping resolution for 1.15.2 dies with
// NoSuchFileException on a clean Gradle home.
def fgCache = new File(gradle.gradleUserHomeDir, 'caches/forge_gradle')
new File(fgCache, 'mcp_repo/de/oceanlabs/mcp/mcp_config/1.15.2').mkdirs()
new File(fgCache, 'minecraft_user_repo/de/oceanlabs/mcp/mcp_config/1.15.2-20200515.085601').mkdirs()

version = '0.5.1'
group = 'ru.wardreg.ccpower'
archivesBaseName = 'ccpower'

sourceCompatibility = 1.8
targetCompatibility = 1.8
compileJava.options.encoding = 'UTF-8'

minecraft {
    mappings channel: 'official', version: '1.15.2'

    runs {
        server {
            workingDirectory project.file('runs/server')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            // FG4 dev has no manifest, so load the mixin config explicitly.
            args '-mixin.config=ccpower.mixins.json'
            mods {
                ccpower {
                    source sourceSets.main
                }
            }
        }
    }
}

repositories {
    mavenCentral()
    maven { url = 'https://repo.spongepowered.org/repository/maven-public/' }
    // fg.deobf needs a module dependency, not files(), so serve libs/ as flatDir.
    flatDir { dirs 'libs' }
}

configurations {
    cctDev
}

// CC:T production jars are SRG-named; fg.deobf remaps them to the dev mapping
// so both compile and runServer see the same class names.
def cctDep = 'cc.tweaked:cc-tweaked-1.15.2:1.97.0'

dependencies {
    minecraft 'net.minecraftforge:forge:1.15.2-31.2.62'
    compileOnly fg.deobf(cctDep)
    cctDev fg.deobf(cctDep)
    implementation 'org.spongepowered:mixin:0.8.4'
    annotationProcessor 'org.spongepowered:mixin:0.8.4:processor'
}

// Make CC:T available as a real mod in the dev server.
tasks.register('copyDevMods', Copy) {
    from configurations.cctDev
    into 'runs/server/mods'
}
tasks.configureEach {
    if (name == 'runServer') dependsOn 'copyDevMods'
}

jar {
    manifest {
        attributes([
            'Specification-Title': 'ccpower',
            'Specification-Vendor': 'wardreg',
            'Specification-Version': '1',
            'Implementation-Title': 'CC: Power',
            'Implementation-Version': project.version,
            'Implementation-Vendor': 'wardreg',
            // Forge 1.16 registers mixin configs through the jar manifest.
            'MixinConfigs': 'ccpower.mixins.json'
        ])
    }
}
jar.finalizedBy('reobfJar')
