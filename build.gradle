plugins {
    id 'architectury-plugin' version '3.4-SNAPSHOT'
    id 'dev.architectury.loom' version '1.11.+' apply false
    id 'com.github.johnrengelman.shadow' version '8.1.1' apply false
}

architectury { minecraft = rootProject.minecraft_version }

subprojects {
    apply plugin: 'dev.architectury.loom'
    loom { silentMojangMappingsLicense() }
    dependencies {
        minecraft "com.mojang:minecraft:${rootProject.minecraft_version}"
        mappings loom.officialMojangMappings()
    }
}

allprojects {
    apply plugin: 'java'
    apply plugin: 'architectury-plugin'
    group = rootProject.maven_group
    version = rootProject.mod_version

    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
        options.release = 17
    }

    // The Gradle JVM is 21 (loom needs it), but MC 1.20.1 / Forge 47 must run
    // its game JVM on Java 17.
    tasks.withType(JavaExec).configureEach {
        javaLauncher.set(javaToolchains.launcherFor {
            languageVersion = JavaLanguageVersion.of(17)
        })
    }

    repositories {
        mavenCentral()
        maven { url = 'https://maven.squiddev.cc' }
        maven { url = rootProject.file('local-maven').toURI() } // patched CC:T (see fetch-cct.sh)
        maven { url = 'https://maven.fabricmc.net/' }
        maven { url = 'https://maven.architectury.dev/' }
        maven { url = 'https://maven.minecraftforge.net/' }
        maven { url = 'https://api.modrinth.com/maven' } // optional Jade compile-time API
    }
}
