plugins {
    id 'java'
    id 'fabric-loom' version '1.19.4'
}

version = '0.5.1'
group = 'ru.wardreg.ccpower'

base {
    archivesName = 'ccpower'
}

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

tasks.withType(JavaCompile).configureEach {
    options.release = 21
    options.encoding = 'UTF-8'
}

loom {
    runs {
        server {
            server()
            runDir('runs/server')
        }
    }
}

repositories {
    mavenCentral()
    maven { url = 'https://maven.squiddev.cc' }   // CC: Tweaked
    maven { url = 'https://maven.fabricmc.net/' }  // Fabric loader, Fabric API, TR Energy
}

dependencies {
    minecraft "com.mojang:minecraft:1.21.1"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:0.16.14"
    modImplementation "net.fabricmc.fabric-api:fabric-api:0.116.18+1.21.1"

    // CC:Tweaked - compile against the maven (named) jar; the production
    // (intermediary-named) jar is supplied to the dev server from runs/server/mods.
    modCompileOnly "cc.tweaked:cc-tweaked-1.21.1-fabric:1.122.0"

    // Team Reborn Energy API - the Fabric FE equivalent (4.1.0 supports MC 1.21+).
    modImplementation "teamreborn:energy:4.1.0"
}

processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') { expand 'version': project.version }
}

// Supply CC:Tweaked to the local dev server as a real mod jar (its JiJ'd
// libraries are then loaded by Fabric Loader itself).
tasks.register('copyDevModsServer', Copy) {
    from files('/tmp/opencode/cct-jars/cct-1211-fabric-1.122.0.jar')
    into 'runs/server/mods'
}
tasks.named('runServer') { dependsOn 'copyDevModsServer' }
