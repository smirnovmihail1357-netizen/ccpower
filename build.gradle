plugins {
    id 'java'
    id 'net.neoforged.moddev' version '2.0.148'
}

version = '0.8.0'
group = 'ru.wardreg.ccpower'

// Minecraft 26.x ships Java 25 (CC:T class files are major version 69).
java.toolchain.languageVersion = JavaLanguageVersion.of(25)

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 25
}

neoForge {
    version = '26.2.0.95'

    validateAccessTransformers = true

    mods {
        ccpower {
            sourceSet sourceSets.main
        }
    }

    runs {
        server {
            server()
            programArgument '--nogui'
            gameDirectory = project.file('runs/server')
        }
    }
}

repositories {
    mavenCentral()
    maven {
        // CC:Tweaked maven repository (artifacts for MC 26.x are published here).
        url = 'https://maven.squiddev.cc'
        content {
            includeGroup 'cc.tweaked'
        }
    }
    maven {
        // Modrinth maven, used only for the optional Jade compile-time API.
        url = 'https://api.modrinth.com/maven'
        content {
            includeGroup 'maven.modrinth'
        }
    }
}

configurations {
    cctRuntime
}

dependencies {
    // CC:Tweaked for MC 26.2 (NeoForge jar, published under the "forge" classifier).
    compileOnly 'cc.tweaked:cc-tweaked-26.2-forge:1.120.2'
    cctRuntime 'cc.tweaked:cc-tweaked-26.2-forge:1.120.2'
    // Jade tooltip integration (compile-only; the plugin class is only loaded
    // when Jade is installed at runtime).
    compileOnly 'maven.modrinth:jade:26.2.10+neoforge'
}

// Make CC:Tweaked available in local dev server runs.
tasks.register('copyDevModsServer', Copy) {
    from configurations.cctRuntime
    into 'runs/server/mods'
}
tasks.configureEach {
    if (name == 'runServer') dependsOn 'copyDevModsServer'
}
