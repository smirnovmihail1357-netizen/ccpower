plugins {
    id 'java'
    id 'net.neoforged.moddev' version '2.0.148'
}

version = '0.5.1'
group = 'ru.wardreg.ccpower'

// Minecraft 26.x ships Java 25 (CC:T class files are major version 69).
java.toolchain.languageVersion = JavaLanguageVersion.of(25)

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 25
}

neoForge {
    version = '26.3.0.113'

    validateAccessTransformers = true

    mods {
        ccpower {
            sourceSet sourceSets.main
        }
    }

    runs {
        server {
            server()
            programArgument '--nogui'
            gameDirectory = project.file('runs/server')
        }
    }
}

repositories {
    mavenCentral()
    maven {
        // CC:Tweaked maven repository (artifacts for MC 26.x are published here).
        url = 'https://maven.squiddev.cc'
        content {
            includeGroup 'cc.tweaked'
        }
    }
}

configurations {
    cctRuntime
}

dependencies {
    // CC:Tweaked for MC 26.3 (NeoForge jar, published under the "forge" classifier).
    compileOnly 'cc.tweaked:cc-tweaked-26.3-forge:1.122.0'
    cctRuntime 'cc.tweaked:cc-tweaked-26.3-forge:1.122.0'
}

// Make CC:Tweaked available in local dev server runs.
tasks.register('copyDevModsServer', Copy) {
    from configurations.cctRuntime
    into 'runs/server/mods'
}
tasks.configureEach {
    if (name == 'runServer') dependsOn 'copyDevModsServer'
}
