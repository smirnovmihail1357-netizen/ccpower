plugins {
    id 'java'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
}

version = '0.5.1'
group = 'ru.wardreg.ccpower'

base { archivesName = 'ccpower' }

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 17
}

minecraft {
    mappings channel: 'official', version: '1.18.1'
    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'info'
            property 'forge.enabledGameTestNamespaces', 'ccpower'
            mods {
                ccpower { source sourceSets.main }
            }
        }
        server {
            args '--nogui'
        }
    }
}

repositories {
    mavenCentral()
    flatDir { dir 'libs' }   // CC:T production jar, resolved as a flatDir dependency
}

configurations {
    cctRuntime
}

dependencies {
    minecraft 'net.minecraftforge:forge:1.18.1-39.1.2'
    // CC:T production jar (SRG member names) must be deobfuscated into the dev
    // mapping space by ForgeGradle. files(...) cannot be deobf'd, hence flatDir.
    compileOnly fg.deobf('cct:cct:1.99.1')
    cctRuntime fg.deobf('cct:cct:1.99.1')
}

tasks.named('processResources', ProcessResources).configure {
    filesMatching('META-INF/mods.toml') { expand 'version': project.version }
}

tasks.named('jar', Jar).configure {
    manifest {
        attributes(['MixinConfigs': 'ccpower.mixins.json'])
    }
    finalizedBy 'reobfJar'
}

// Put the DEOBFUSCATED CC:Tweaked jar into the dev run's mods folder for
// runServer smoke tests (FG's deobf'd artifact, not the raw SRG release jar).
tasks.register('copyDevMods', Copy) {
    from configurations.cctRuntime
    into 'run/mods'
}
tasks.configureEach { if (name == 'runServer') dependsOn 'copyDevMods' }
