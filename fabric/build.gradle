plugins {
    id 'java'
    id 'fabric-loom' version '1.11.8'
}

version = '0.5.1'
group = 'ru.wardreg.ccpower'

base { archivesName = 'ccpower' }

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
}

repositories {
    mavenCentral()
    maven {
        url = 'https://maven.squiddev.cc'
        content { includeGroup 'cc.tweaked' }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:1.21.8"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:0.16.14"
    modImplementation "net.fabricmc.fabric-api:fabric-api:0.136.1+1.21.8"

    // CC:Tweaked Fabric build (compile + dev runtime for the smoke test).
    modImplementation "cc.tweaked:cc-tweaked-1.21.8-fabric:1.116.1"

    // Team Reborn Energy - the Fabric FE API (compile + dev runtime).
    modApi "teamreborn:energy:4.2.0"
}

processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') { expand 'version': project.version }
}
