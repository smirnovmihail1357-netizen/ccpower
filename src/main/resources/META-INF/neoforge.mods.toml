type = "required"
versionRange = "[21.1.248,)"
ordering = "NONE"
side = "BOTH"

[[dependencies.ccpower]]
modId = "minecraft"
type = "required"
versionRange = "[1.21.1]"
ordering = "NONE"
side = "BOTH"

[[dependencies.ccpower]]
modId = "computercraft"
type = "required"
versionRange = "[1.116.0,)"
ordering = "AFTER"
side = "BOTH"

[[dependencies.ccpower]]
