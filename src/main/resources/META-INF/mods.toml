[[mods]]
modId = "ccpower"
version = "0.5.1"
displayName = "CC: Power"
authors = "wardreg"
description = '''
Adds RF (Forge Energy) power consumption to CC:Tweaked computers and turtles.
Computers draw energy from adjacent blocks; turtles carry a small internal
battery recharged at the Recharge Dock (drone station).
'''

